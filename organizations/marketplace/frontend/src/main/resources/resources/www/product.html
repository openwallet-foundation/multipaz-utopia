<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="referrer" content="unsafe-url">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Product — Utopia Marketplace</title>
    <link rel="stylesheet" href="marketplace.css">
    <script src="catalog.js"></script>
    <script src="verify_credentials.js"></script>
    <script src="marketplace.js" defer></script>
    <script>window.UTOPIA_SERVICE = "marketplace";</script>
    <script src="utopia-chrome.js"></script>
</head>
<body>
<!-- Header and footer come from utopia-chrome.js. -->
<main class="mk-page mk-page--narrow">
    <a href="index.html" class="mk-back">&#8592; Back to aisles</a>

    <div class="mk-product">
        <div id="product-art" class="mk-product-art washed">
            <span id="product-glyph" class="mk-product-glyph"></span>
        </div>

        <div class="mk-product-info">
            <p id="product-label" class="mk-eyebrow"></p>
            <h1 id="product-name" class="mk-product-name"></h1>
            <p id="product-description" class="mk-product-desc"></p>

            <div id="product-highlights" class="mk-tags"></div>

            <div class="mk-buy">
                <div class="mk-buy-row">
                    <div>
                        <p class="mk-buy-label">Price</p>
                        <p id="product-price" class="mk-buy-price"></p>
                        <p id="product-unit" class="mk-buy-unit"></p>
                    </div>
                    <div class="mk-buy-avail">
                        <p class="mk-buy-label">Availability</p>
                        <p id="product-availability" class="mk-buy-stock">In stock</p>
                    </div>
                </div>
                <button id="buy-btn" class="mk-cta" onclick="onBuyClick()">
                    Add to cart &amp; check out
                </button>
                <p id="delivery-note" class="mk-buy-note"></p>
            </div>

            <div id="product-specs" class="mk-specs"></div>
        </div>
    </div>

    <div class="mk-note">
        <h3 id="note-heading">Freshly stocked at Utopia Marketplace</h3>
        <p id="note-body"></p>
    </div>
</main>

<!-- Result overlay -->
<div id="result-overlay" class="mk-overlay hidden">
    <div id="result-box" class="mk-dialog">
        <div id="result-content"></div>
        <button class="mk-dialog-close" onclick="closeOverlay()">Close</button>
    </div>
</div>

<!-- Loading overlay -->
<div id="loading-overlay" class="mk-overlay hidden">
    <div class="mk-dialog mk-dialog--loading">
        <div class="mk-spinner"></div>
        <p id="loading-text">Processing checkout…</p>
    </div>
</div>
</body>
</html>
