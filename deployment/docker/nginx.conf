# Multipaz Server Bundle - nginx reverse proxy configuration
# Routes requests by path prefix to individual services

worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /run/nginx/nginx.pid;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # Upstream definitions for each service
    upstream registry {
        server 127.0.0.1:8004;
    }

    upstream bank_of_utopia {
        server 127.0.0.1:8017;
    }

    upstream dmv {
        server 127.0.0.1:8002;
    }

    upstream upay {
        server 127.0.0.1:8009;
    }

    upstream marketplace {
        server 127.0.0.1:8010;
    }

    upstream marketplace_mcp {
        server 127.0.0.1:8011;
    }

    server {
        listen 8100;
        server_name _;

        # Keep the `return 302 /upay/`-style redirects below RELATIVE. nginx would otherwise expand
        # them against this server's own name and port, emitting `http://<host>:8100/upay/` — wrong
        # scheme and wrong port for anyone reaching the stack through a tunnel or a proxy, which
        # lands as a timeout rather than a redirect. Relative Location headers resolve against
        # whatever origin the browser actually used, so they are correct in every deployment.
        absolute_redirect off;

        # Increase buffer sizes for large JWT tokens
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        # Common proxy settings
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Records server (System of Record)
        location /registry/ {
            proxy_pass http://registry/;
        }
        location = /registry {
            return 302 /registry/;
        }

        # Payment server
        location /upay/ {
            proxy_pass http://upay/;
        }
        location = /upay {
            return 302 /upay/;
        }

        # Bank of Utopia
        location /bank_of_utopia/ {
            proxy_pass http://bank_of_utopia/;
        }
        location = /bank_of_utopia {
            return 302 /bank_of_utopia/;
        }
        location = /.well-known/oauth-authorization-server/bank_of_utopia {
            proxy_pass http://bank_of_utopia/.well-known/oauth-authorization-server;
        }
        location = /.well-known/openid-credential-issuer/bank_of_utopia {
            proxy_pass http://bank_of_utopia/.well-known/openid-credential-issuer;
        }



        # DMV
        location /dmv/ {
            proxy_pass http://dmv/;
        }
        location = /dmv {
            return 302 /dmv/;
        }
        location = /.well-known/oauth-authorization-server/dmv {
            proxy_pass http://dmv/.well-known/oauth-authorization-server;
        }
        location = /.well-known/openid-credential-issuer/dmv {
            proxy_pass http://dmv/.well-known/openid-credential-issuer;
        }


        # Marketplace server
        location /marketplace/ {
            proxy_pass http://marketplace/;
        }
        location = /marketplace {
            return 302 /marketplace/;
        }

        # MCP storefront (Node): the agentic front-door — MCP tools at /mcp, plus the mounted
        # CredentAgent rails (/credentagent/*) and its checkout page. Served from THIS origin so
        # the delegated approve page and the Multipaz verifier under /marketplace/ share one
        # origin — the wallet ceremony is origin-bound.
        location /mcp {
            proxy_pass http://marketplace_mcp;
            proxy_buffering off;
            proxy_set_header Connection "";
        }
        location /credentagent/ {
            proxy_pass http://marketplace_mcp;
        }
        location /checkout {
            proxy_pass http://marketplace_mcp;
        }

        # MCP auth discovery must 404. Without this the SPA catch-all below answers with
        # index.html, and MCP clients read that as a sign-in service and fail trying to register.
        # The exact-match issuer well-knowns above still take priority over this prefix.
        location /.well-known/ {
            proxy_pass http://marketplace_mcp;
        }
        location /register {
            proxy_pass http://marketplace_mcp;
        }

        # Root - serve the Utopia landing page and the shared theme assets
        location / {
            root /app/web;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Health check endpoint
        location /health {
            default_type application/json;
            return 200 '{"status":"ok"}';
        }
    }
}
